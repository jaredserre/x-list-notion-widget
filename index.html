<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>X List Feed</title>
  <style>
    :root {
      --surface: rgba(255, 255, 255, 0.96);
      --surface-muted: #f7f9f9;
      --text: #0f1419;
      --muted: #536471;
      --border: rgba(15, 20, 25, 0.12);
      --accent: #1d9bf0;
      --danger: #b42318;
      --shadow: 0 10px 30px rgba(15, 20, 25, 0.08);
    }

    :root[data-theme="dark"] {
      --surface: rgba(0, 0, 0, 0.94);
      --surface-muted: #16181c;
      --text: #e7e9ea;
      --muted: #8b98a5;
      --border: rgba(239, 243, 244, 0.16);
      --accent: #1d9bf0;
      --danger: #ff7a70;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 0;
    }

    button,
    a {
      font: inherit;
    }

    .widget {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .heading {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .x-mark {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-muted);
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      overflow: hidden;
      margin: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 17px;
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 999px;
      background: var(--muted);
    }

    .status-dot.is-live {
      background: #00a650;
      box-shadow: 0 0 0 3px rgba(0, 166, 80, 0.12);
    }

    .status-dot.is-error {
      background: var(--danger);
    }

    .actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
    }

    .action {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-muted);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      text-decoration: none;
      transition: transform 120ms ease, background 120ms ease;
    }

    .action:hover {
      transform: translateY(-1px);
    }

    .action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .timeline {
      width: 100%;
      min-height: 420px;
      background: var(--surface);
    }

    .timeline > iframe {
      display: block !important;
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
    }

    .message {
      display: grid;
      min-height: 420px;
      place-items: center;
      padding: 28px;
      background: var(--surface);
      text-align: center;
    }

    .message-card {
      max-width: 540px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-muted);
    }

    .message h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .message p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .message code {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .error-note {
      margin: 10px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--danger) 38%, transparent);
      border-radius: 10px;
      background: color-mix(in srgb, var(--danger) 8%, transparent);
      color: var(--danger);
      font-size: 12px;
      line-height: 1.45;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .toolbar {
        align-items: flex-start;
      }

      .action.open-x {
        display: none;
      }

      .action {
        min-height: 32px;
        padding: 7px 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .action {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="widget" id="widget">
    <header class="toolbar" id="toolbar">
      <div class="heading">
        <div class="x-mark" aria-hidden="true">X</div>
        <div class="title-block">
          <h1 id="widget-title">X List</h1>
          <p class="status">
            <span class="status-dot" id="status-dot" aria-hidden="true"></span>
            <span id="status-text">Preparing feed...</span>
          </p>
        </div>
      </div>
      <div class="actions">
        <a class="action open-x" id="open-x" href="https://x.com/i/lists" target="_blank" rel="noopener noreferrer">Open in X</a>
        <button class="action" id="refresh-button" type="button" aria-label="Refresh the X List feed">Refresh</button>
      </div>
    </header>

    <section class="timeline" id="timeline" aria-label="Posts from an X List"></section>
    <p class="error-note" id="error-note" role="alert" hidden></p>

    <noscript>
      <section class="message">
        <div class="message-card">
          <h2>JavaScript is required</h2>
          <p>This widget needs JavaScript to load the X List timeline.</p>
        </div>
      </section>
    </noscript>
  </main>

  <script>
    (() => {
      "use strict";

      /*
       * DEFAULT SETTINGS
       * You can edit these values, or override them in the embed URL:
       * ?list=1234567890123456789&title=Tax%20Policy&theme=light&refresh=5
       */
      const DEFAULTS = Object.freeze({
        list: "REPLACE_WITH_YOUR_LIST_ID",
        title: "X List",
        theme: "light",      // light, dark, or auto
        refresh: 5,          // minutes; set to 0 to disable automatic refresh
        minimumHeight: 420
      });

      const elements = {
        toolbar: document.getElementById("toolbar"),
        timeline: document.getElementById("timeline"),
        title: document.getElementById("widget-title"),
        statusText: document.getElementById("status-text"),
        statusDot: document.getElementById("status-dot"),
        openX: document.getElementById("open-x"),
        refreshButton: document.getElementById("refresh-button"),
        errorNote: document.getElementById("error-note")
      };

      const params = new URLSearchParams(window.location.search);

      function cleanText(value, fallback, maxLength = 80) {
        const text = String(value || "").trim();
        return (text || fallback).slice(0, maxLength);
      }

      function extractListId(value) {
        const text = String(value || "").trim();
        if (/^\d{1,25}$/.test(text)) return text;

        const match = text.match(/(?:\/lists\/|[?&]list=)(\d{1,25})(?:\b|\/|\?|&|$)/i);
        return match ? match[1] : "";
      }

      function clampNumber(value, fallback, minimum, maximum) {
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) return fallback;
        return Math.min(maximum, Math.max(minimum, parsed));
      }

      function resolveTheme(value) {
        const requested = String(value || "").toLowerCase();
        if (requested === "dark") return "dark";
        if (requested === "auto") {
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        return "light";
      }

      const rawList = params.get("list") || DEFAULTS.list;
      const listId = extractListId(rawList);
      const title = cleanText(params.get("title"), DEFAULTS.title);
      const theme = resolveTheme(params.get("theme") || DEFAULTS.theme);
      const refreshMinutes = clampNumber(
        params.get("refresh") ?? DEFAULTS.refresh,
        DEFAULTS.refresh,
        0,
        1440
      );

      document.documentElement.dataset.theme = theme;
      document.title = title;
      elements.title.textContent = title;
      elements.refreshButton.addEventListener("click", () => window.location.reload());

      function setStatus(message, state = "loading") {
        elements.statusText.textContent = message;
        elements.statusDot.classList.toggle("is-live", state === "live");
        elements.statusDot.classList.toggle("is-error", state === "error");
      }

      function showSetupMessage() {
        setStatus("List ID needed", "error");
        elements.openX.hidden = true;
        elements.refreshButton.hidden = true;
        elements.timeline.innerHTML = `
          <div class="message">
            <div class="message-card">
              <h2>Add your X List ID</h2>
              <p>
                Copy the number from a public List URL such as
                <strong>https://x.com/i/lists/1234567890123456789</strong>, then place it after
                <strong>?list=</strong> in this page's URL.
              </p>
              <code>?list=1234567890123456789&amp;title=My%20List&amp;refresh=5</code>
            </div>
          </div>`;
      }

      function showLoadWarning(message) {
        elements.errorNote.textContent = message;
        elements.errorNote.hidden = false;
        setStatus("X feed could not be confirmed", "error");
      }

      if (!listId) {
        showSetupMessage();
        return;
      }

      const listUrl = `https://x.com/i/lists/${listId}`;
      elements.openX.href = listUrl;
      elements.timeline.setAttribute("aria-label", `Posts from ${title}`);

      const availableHeight = Math.max(
        DEFAULTS.minimumHeight,
        Math.floor(window.innerHeight - elements.toolbar.getBoundingClientRect().height - 2)
      );

      const timelineLink = document.createElement("a");
      timelineLink.className = "twitter-timeline";
      timelineLink.href = listUrl;
      timelineLink.dataset.listId = listId;
      timelineLink.dataset.theme = theme;
      timelineLink.dataset.height = String(availableHeight);
      timelineLink.dataset.chrome = "noheader nofooter noborders transparent";
      timelineLink.dataset.dnt = "true";
      timelineLink.textContent = `Open ${title} on X`;
      elements.timeline.appendChild(timelineLink);

      let rendered = false;
      let refreshDeadline = 0;
      let countdownTimer = null;

      if (refreshMinutes > 0) {
        refreshDeadline = Date.now() + refreshMinutes * 60 * 1000;
        window.setTimeout(() => window.location.reload(), refreshMinutes * 60 * 1000);
      }

      function formatCountdown(milliseconds) {
        const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      function startRefreshClock() {
        if (refreshMinutes <= 0) {
          setStatus("Live X List feed", "live");
          return;
        }

        const update = () => {
          const remaining = refreshDeadline - Date.now();
          if (remaining <= 0) {
            window.location.reload();
            return;
          }
          setStatus(`Auto-refresh in ${formatCountdown(remaining)}`, "live");
        };

        update();
        countdownTimer = window.setInterval(update, 1000);
      }

      function markRendered() {
        if (rendered) return;
        rendered = true;
        elements.errorNote.hidden = true;
        startRefreshClock();
      }

      const observer = new MutationObserver(() => {
        if (elements.timeline.querySelector("iframe")) {
          markRendered();
          observer.disconnect();
        }
      });
      observer.observe(elements.timeline, { childList: true, subtree: true });

      function loadXWidgets() {
        setStatus("Loading posts from X...");

        const existing = document.getElementById("x-wjs");
        if (existing && window.twttr && window.twttr.widgets) {
          window.twttr.widgets.load(elements.timeline);
          return;
        }

        window.twttr = window.twttr || {};
        window.twttr._e = window.twttr._e || [];
        window.twttr.ready = window.twttr.ready || function ready(callback) {
          window.twttr._e.push(callback);
        };

        const script = existing || document.createElement("script");
        if (!existing) {
          script.id = "x-wjs";
          script.async = true;
          script.src = "https://platform.x.com/widgets.js";
          script.charset = "utf-8";
          script.onerror = () => {
            showLoadWarning(
              "X's embed script was blocked or unavailable. Check that the List is public and that your browser or network is not blocking X embeds."
            );
          };
          document.head.appendChild(script);
        }

        window.twttr.ready((twttr) => {
          try {
            twttr.widgets.load(elements.timeline);
          } catch (error) {
            showLoadWarning("The X timeline could not be rendered. Open the List directly to confirm that it is public.");
          }
        });
      }

      loadXWidgets();

      window.setTimeout(() => {
        if (!rendered) {
          showLoadWarning(
            "The feed is taking longer than expected to load. The List may be private, X may be unavailable, or a privacy extension may be blocking the embed."
          );
        }
      }, 15000);

      window.addEventListener("beforeunload", () => {
        if (countdownTimer) window.clearInterval(countdownTimer);
        observer.disconnect();
      });
    })();
  </script>
</body>
</html>
